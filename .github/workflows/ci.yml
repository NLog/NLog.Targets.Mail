name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  windows:
    name: Build & test (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Restore solution
        run: dotnet restore NLog.Targets.Mail.sln
      - name: Build solution
        run: dotnet build NLog.Targets.Mail.sln --configuration Release --no-restore -p:ContinuousIntegrationBuild=true -p:EmbedUntrackedSources=true -p:PublishRepositoryUrl=true
      - name: Test .NET Framework with coverage
        run: dotnet test tests/NLog.Targets.Mail.Tests/NLog.Targets.Mail.Tests.csproj --framework net462 --configuration Release --logger GitHubActions --collect:"XPlat Code Coverage" -- RunConfiguration.DisableAppDomain=true
      - name: Test .NET with coverage
        run: dotnet test tests/NLog.Targets.Mail.Tests/NLog.Targets.Mail.Tests.csproj --framework net8.0 --configuration Release --logger GitHubActions --collect:"XPlat Code Coverage"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-windows
          path: tests/NLog.Targets.Mail.Tests/TestResults/**/coverage.cobertura.xml
          if-no-files-found: ignore

  ubuntu:
    name: Build & test (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build netstandard2.1
        run: dotnet build src/NLog.Targets.Mail/NLog.Targets.Mail.csproj --framework netstandard2.1 --configuration Release
      - name: Test .NET with coverage
        run: dotnet test tests/NLog.Targets.Mail.Tests/NLog.Targets.Mail.Tests.csproj --framework net8.0 --configuration Release --logger GitHubActions --collect:"XPlat Code Coverage"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-ubuntu
          path: tests/NLog.Targets.Mail.Tests/TestResults/**/coverage.cobertura.xml
          if-no-files-found: ignore

  pack:
    name: Create NuGet package
    needs: [windows, ubuntu]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Create NuGet package
        run: dotnet pack src/NLog.Targets.Mail/NLog.Targets.Mail.csproj --configuration Release --output artifacts -p:IncludeSymbols=true -p:SymbolPackageFormat=snupkg
      - uses: actions/upload-artifact@v7
        with:
          name: NuGetPackages
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg
          if-no-files-found: error
      - name: Download NuGet package
        uses: actions/download-artifact@v7
        with:
          name: NuGetPackages
          path: artifacts

  coverage:
    needs: [windows, ubuntu]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          pattern: coverage-*
          path: coverage
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # 7.1.1
        with:
          files: coverage/**/coverage.cobertura.xml
          fail_ci_if_error: true
